<title id="title">AI Kernel 101 — 方案 C · 像素矩阵</title>
<desc id="description">OPEN SOURCE · KERNEL ENGINEERING。从 Hello World 到 Flash Attention。Ascend C · First Principles · Performance。UNDERSTAND THE COMPUTE. ENGINEER THE PERFORMANCE.。@LamberttLiu。三个面板位置保持原样；底层矩阵与无描边的白色 101 共用 32 px 步距、30 px 色块和 2 px 内部间隙。青色流线从第一框顶部连接第二框顶部，再从第二框底部连接第三框底部，每段以圆点起始、实心锐角三角箭头结束。中央红色分块表示活跃计算。图形是品牌概念，不代表具体算法、设备或测量结果。</desc>
